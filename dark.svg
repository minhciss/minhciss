<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', 'Lucida Console', monospace">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes typing-name {
        from { width: 0; }
        to { width: 100%; }
      }
      .cursor { animation: blink 1s step-end infinite; }
      .line1  { animation: fadeIn 0.3s ease forwards; animation-delay: 0.2s; opacity: 0; }
      .line2  { animation: fadeIn 0.3s ease forwards; animation-delay: 0.5s; opacity: 0; }
      .line3  { animation: fadeIn 0.3s ease forwards; animation-delay: 0.8s; opacity: 0; }
      .line4  { animation: fadeIn 0.3s ease forwards; animation-delay: 1.1s; opacity: 0; }
      .line5  { animation: fadeIn 0.3s ease forwards; animation-delay: 1.4s; opacity: 0; }
      .line6  { animation: fadeIn 0.3s ease forwards; animation-delay: 1.7s; opacity: 0; }
      .line7  { animation: fadeIn 0.3s ease forwards; animation-delay: 2.0s; opacity: 0; }
      .line8  { animation: fadeIn 0.3s ease forwards; animation-delay: 2.3s; opacity: 0; }
      .line9  { animation: fadeIn 0.3s ease forwards; animation-delay: 2.6s; opacity: 0; }
      .line10 { animation: fadeIn 0.3s ease forwards; animation-delay: 2.9s; opacity: 0; }
      .line11 { animation: fadeIn 0.3s ease forwards; animation-delay: 3.2s; opacity: 0; }
      .line12 { animation: fadeIn 0.3s ease forwards; animation-delay: 3.5s; opacity: 0; }
      .line13 { animation: fadeIn 0.3s ease forwards; animation-delay: 3.8s; opacity: 0; }
      .line14 { animation: fadeIn 0.3s ease forwards; animation-delay: 4.1s; opacity: 0; }
      .line15 { animation: fadeIn 0.3s ease forwards; animation-delay: 4.4s; opacity: 0; }
    </style>
  </defs>

